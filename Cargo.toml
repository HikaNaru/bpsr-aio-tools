[workspace]
members = [
    "crates/core",
    "crates/capture",
    "crates/game",
    "crates/dps-meter",
    "crates/auto-fishing",
    "crates/modules-optimizer",
    "crates/encounter-store",
    "crates/chat",
    "crates/cooldown-tracker",
    "crates/ui",
    "crates/bptimer",
    "crates/threat-meter",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
anyhow             = "1"
parking_lot        = "0.12"
indexmap           = { version = "2", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes              = "1"
crossbeam-channel  = "0.5"
egui               = "0.29"
eframe             = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_plot          = "0.29"
egui-phosphor      = "0.7"
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
once_cell          = { version = "1" }
zstd               = "0.13"
prost              = "0.14"
byteorder          = "1"
rodio              = { version = "0.17", default-features = false }
image              = { version = "0.25", default-features = false, features = ["png"] }
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite        = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[package]
name        = "bpsr-aio-tools"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bpsr-aio-tools"
path = "src/main.rs"

[dependencies]
eframe             = { workspace = true }
egui               = { workspace = true }
egui-phosphor      = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
parking_lot        = { workspace = true }
crossbeam-channel  = { workspace = true }

core               = { path = "crates/core" }
capture            = { path = "crates/capture" }
game               = { path = "crates/game" }
dps-meter          = { path = "crates/dps-meter" }
auto-fishing       = { path = "crates/auto-fishing" }
modules-optimizer  = { path = "crates/modules-optimizer" }
encounter-store    = { path = "crates/encounter-store" }
chat               = { path = "crates/chat" }
cooldown-tracker   = { path = "crates/cooldown-tracker" }
bptimer            = { path = "crates/bptimer" }
threat-meter       = { path = "crates/threat-meter" }
ui                 = { path = "crates/ui" }
rodio              = { workspace = true }
image              = { workspace = true }

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = "symbols"

[profile.dev]
opt-level = 1
